<style>
  /* petry artifact is ALWAYS light — the og-components chart uses a fixed light theme. */
  :root {
    color-scheme: light;
    --bg: #f7f8fa; --panel: #ffffff; --ink: #14181f; --muted: #5b6472;
    --line: #e6e9ef; --accent: #0f766e; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 20px 40px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden; }
  .head { padding: 20px 22px 8px; }
  .name { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .badges { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); background: transparent; }
  .badge.status { color: #065f46; background: rgba(16,185,129,.12); border-color: transparent; text-transform: capitalize; }
  .note { margin: 10px 22px 0; padding: 8px 12px; font-size: 12.5px; border-radius: 8px;
    background: rgba(234,179,8,.12); color: #92650a; border: 1px solid rgba(234,179,8,.25); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr));
    gap: 1px; background: var(--line); margin: 18px 0 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .kpi { background: var(--panel); padding: 14px 18px; }
  .kpi .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .chartwrap { padding: 14px 16px 6px; }
  #chart-mount { width: 100%; min-height: 340px; }
  .activity { padding: 4px 22px 20px; }
  .act-hd { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
    font-weight: 600; margin: 4px 0 10px; }
  .act-hd .from { text-transform: none; letter-spacing: 0; font-weight: 500; opacity: .8; }
  .act-item { display: grid; grid-template-columns: 14px 108px auto; gap: 10px; align-items: baseline;
    padding: 7px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .act-dot { grid-column: 1; width: 8px; height: 8px; border-radius: 999px; align-self: center; }
  .act-meta { grid-column: 2; display: flex; flex-direction: column; gap: 2px; }
  .act-badge { font-size: 10.5px; text-transform: uppercase; letter-spacing: .03em; font-weight: 700; }
  .act-date { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .act-text { grid-column: 3; color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div class="name" id="wellName">{{TITLE}}</div>
      <div class="sub" id="wellSub"></div>
      <div class="badges" id="badges"></div>
    </div>
    <div class="note" id="note" style="display:none"></div>
    <div class="kpis" id="kpis"></div>
    <div class="chartwrap"><div id="chart-mount"></div></div>
    <div class="activity" id="activity" style="display:none"></div>
  </div>

<script>
  const DATA = {{CHART_DATA_JSON}};

  const fmt = (n) => {
    if (n == null || isNaN(n)) return "—";
    const a = Math.abs(n);
    if (a >= 1e6) return (n/1e6).toFixed(1) + "M";
    if (a >= 1e3) return (n/1e3).toFixed(1) + "k";
    if (a >= 100) return Math.round(n).toLocaleString();
    return (Math.round(n*10)/10).toLocaleString();
  };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const TYPE_META = {
    event:{c:"#f59e0b",label:"Event"}, decision:{c:"#8b5cf6",label:"Decision"},
    correction:{c:"#ef4444",label:"Correction"}, measurement:{c:"#10b981",label:"Measurement"},
    instruction:{c:"#0ea5e9",label:"Instruction"}, preference:{c:"#0ea5e9",label:"Preference"},
    note:{c:"#64748b",label:"Note"},
  };

  // Header
  const w = DATA.well || { name: document.getElementById("wellName").textContent };
  document.getElementById("wellName").textContent = w.name || "Well";
  document.title = (w.name || "Well") + " — production profile";
  document.getElementById("wellSub").textContent = [w.operator, w.formation].filter(Boolean).join(" · ");
  const badges = [];
  if (w.status) badges.push(`<span class="badge status">${esc(w.status)}</span>`);
  for (const k of ["basin","county","state"]) if (w[k]) badges.push(`<span class="badge">${esc(w[k])}</span>`);
  document.getElementById("badges").innerHTML = badges.join("");
  if (DATA.note) { const n = document.getElementById("note"); n.style.display="block"; n.textContent = DATA.note; }

  // KPIs
  let kpis = DATA.kpis;
  if (!Array.isArray(kpis) || !kpis.length) {
    const ser = DATA.series || {};
    const unit = DATA.unit || "bbl/d";
    const last = (arr) => (Array.isArray(arr) && arr.length ? arr[arr.length-1] : null);
    kpis = [
      { label:"Last Oil",   value: last(ser.oil),   unit },
      { label:"Last Water", value: last(ser.water), unit },
      { label:"Last Gas",   value: last(ser.gas),   unit:"mcf/d" },
    ].filter((k) => k.value != null);
  }
  document.getElementById("kpis").innerHTML = kpis.map((k) =>
    `<div class="kpi"><div class="v">${fmt(k.value)}${k.unit?` <span style="font-size:12px;color:var(--muted);font-weight:600">${esc(k.unit)}</span>`:""}</div><div class="l">${esc(k.label)}</div></div>`
  ).join("");

  // Activity (from the local vault)
  const activity = Array.isArray(DATA.activity) ? DATA.activity : [];
  if (activity.length) {
    const sorted = activity.slice().sort((a,b) => String(b.date||"").localeCompare(String(a.date||"")));
    const rows = sorted.map((a) => {
      const m = TYPE_META[a.type] || TYPE_META.note;
      return `<div class="act-item"><span class="act-dot" style="background:${m.c}"></span>` +
        `<span class="act-meta"><span class="act-badge" style="color:${m.c}">${m.label}</span>` +
        `<span class="act-date">${esc(a.date||"")}</span></span>` +
        `<span class="act-text">${esc(a.text)}</span></div>`;
    }).join("");
    const el = document.getElementById("activity");
    el.style.display = "block";
    el.innerHTML = `<div class="act-hd">Activity <span class="from">· ${activity.length} from your vault</span></div>` + rows;
  }

  // The real og-components chart
  window.OGChart.render(document.getElementById("chart-mount"), DATA);
</script>
</body>
</html>
